host: localhost:8080
info:
  contact:
    email: support@example.com
    name: Đội ngũ phát triển
  description: Đặc tả API ứng dụng quản lý công việc nhiều cấp (Golang Fiber + PostgreSQL)
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Task Management Multi-Level API
  version: "1.1"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Xác thực tài khoản bằng username/password và nhận JWT Access Token
      parameters:
      - description: Thông tin tài khoản
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Đăng nhập hệ thống
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Thu hồi Refresh Token hiện tại
      parameters:
      - description: Refresh Token
        in: body
        name: request
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.LogoutResponse'
              type: object
      summary: Đăng xuất
      tags:
      - Auth
  /auth/me:
    get:
      description: Lấy thông tin cá nhân và vai trò của người dùng đang đăng nhập
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.UserInfoResp'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Thông tin tài khoản hiện tại
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Dùng Refresh Token hợp lệ để cấp mới Access Token
      parameters:
      - description: Refresh Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
