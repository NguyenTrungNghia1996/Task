basePath: /api/v1
definitions:
  internal_modules_auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  internal_modules_auth.LoginResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/internal_modules_auth.UserInfoResp'
    type: object
  internal_modules_auth.LogoutResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  internal_modules_auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_modules_auth.UserInfoResp:
    properties:
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      organization_id:
        type: string
      permissions:
        items:
          type: string
        type: array
      roles:
        items:
          type: string
        type: array
      username:
        type: string
    type: object
  internal_modules_menus.AntdMenuItem:
    properties:
      children:
        description: Menu con
        items:
          $ref: '#/definitions/internal_modules_menus.AntdMenuItem'
        type: array
      icon:
        description: 'vd: "ProjectOutlined"'
        type: string
      key:
        description: 'vd: "/tasks/all"'
        type: string
      label:
        description: 'vd: "Tất cả công việc"'
        type: string
      path:
        description: 'vd: "/tasks/all"'
        type: string
    type: object
  internal_modules_menus.CreateMenuRequest:
    properties:
      code:
        maxLength: 100
        minLength: 2
        type: string
      icon:
        maxLength: 100
        type: string
      is_active:
        type: boolean
      is_hidden:
        type: boolean
      parent_id:
        type: string
      path:
        maxLength: 255
        type: string
      required_permission:
        maxLength: 100
        type: string
      sort_order:
        type: integer
      title:
        maxLength: 255
        minLength: 2
        type: string
    required:
    - code
    - title
    type: object
  internal_modules_menus.UpdateMenuRequest:
    properties:
      icon:
        maxLength: 100
        type: string
      is_active:
        type: boolean
      is_hidden:
        type: boolean
      parent_id:
        type: string
      path:
        maxLength: 255
        type: string
      required_permission:
        maxLength: 100
        type: string
      sort_order:
        type: integer
      title:
        maxLength: 255
        minLength: 2
        type: string
    type: object
  internal_modules_notifications.MarkAllReadResponse:
    properties:
      success:
        type: boolean
      updated_count:
        type: integer
    type: object
  internal_modules_notifications.UnreadCountResponse:
    properties:
      unread_count:
        type: integer
    type: object
  internal_modules_rbac.CreatePermissionRequest:
    properties:
      code:
        maxLength: 100
        minLength: 3
        type: string
      description:
        type: string
      module:
        maxLength: 50
        minLength: 2
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
    required:
    - code
    - module
    - name
    type: object
  internal_modules_rbac.ModuleGroupedPermissions:
    properties:
      module:
        type: string
      permissions:
        items:
          $ref: '#/definitions/taskmgmt_internal_model.Permission'
        type: array
    type: object
  internal_modules_rbac.PermissionOption:
    properties:
      label:
        description: 'vd: "Xem danh sách công việc (tasks:view)"'
        type: string
      module:
        description: 'vd: "Quản lý công việc"'
        type: string
      value:
        description: 'vd: "tasks:view"'
        type: string
    type: object
  internal_modules_rbac.RoleWithPermissionsResponse:
    properties:
      permissions:
        items:
          $ref: '#/definitions/taskmgmt_internal_model.Permission'
        type: array
      role:
        $ref: '#/definitions/taskmgmt_internal_model.Role'
    type: object
  internal_modules_rbac.UpdateRolePermissionsRequest:
    properties:
      permission_codes:
        items:
          type: string
        type: array
    required:
    - permission_codes
    type: object
  internal_modules_tasks.AssignmentInput:
    properties:
      id:
        type: string
      responsible_user_id:
        type: string
      type:
        enum:
        - user
        - department
        type: string
    required:
    - id
    - type
    type: object
  internal_modules_tasks.CancelTaskRequest:
    properties:
      reason:
        maxLength: 2000
        minLength: 5
        type: string
    required:
    - reason
    type: object
  internal_modules_tasks.CreateAssignmentRequest:
    properties:
      assignment_role:
        enum:
        - responsible
        - supporting
        - observer
        type: string
      id:
        type: string
      is_primary:
        type: boolean
      note:
        type: string
      responsible_user_id:
        type: string
      type:
        enum:
        - user
        - department
        type: string
    required:
    - id
    - type
    type: object
  internal_modules_tasks.CreateChildTaskRequest:
    properties:
      approval_required:
        type: boolean
      description:
        type: string
      due_at:
        type: string
      initial_assignment:
        $ref: '#/definitions/internal_modules_tasks.AssignmentInput'
      priority:
        maximum: 3
        minimum: 1
        type: integer
      start_at:
        type: string
      title:
        maxLength: 255
        type: string
      weight:
        minimum: 1
        type: integer
    required:
    - initial_assignment
    - title
    type: object
  internal_modules_tasks.CreateCommentRequest:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  internal_modules_tasks.CreateTaskRequest:
    properties:
      approval_required:
        type: boolean
      description:
        type: string
      due_at:
        type: string
      initial_assignment:
        $ref: '#/definitions/internal_modules_tasks.AssignmentInput'
      priority:
        maximum: 3
        minimum: 1
        type: integer
      start_at:
        type: string
      title:
        maxLength: 255
        type: string
    required:
    - initial_assignment
    - title
    type: object
  internal_modules_tasks.CreateTaskReviewRequest:
    properties:
      comment:
        type: string
      decision:
        enum:
        - approved
        - revision_required
        type: string
      update_id:
        type: string
    required:
    - decision
    - update_id
    type: object
  internal_modules_tasks.CreateTaskUpdateRequest:
    properties:
      attachment_ids:
        items:
          type: string
        type: array
      content:
        type: string
      progress:
        maximum: 100
        minimum: 0
        type: integer
    required:
    - content
    type: object
  internal_modules_tasks.ReopenTaskRequest:
    properties:
      reason:
        maxLength: 2000
        minLength: 5
        type: string
    required:
    - reason
    type: object
  internal_modules_tasks.UpdateTaskRequest:
    properties:
      description:
        type: string
      due_at:
        type: string
      priority:
        maximum: 3
        minimum: 1
        type: integer
      title:
        maxLength: 255
        type: string
      version:
        description: Optimistic Locking
        minimum: 1
        type: integer
    required:
    - version
    type: object
  taskmgmt_internal_model.Department:
    properties:
      children:
        items:
          $ref: '#/definitions/taskmgmt_internal_model.Department'
        type: array
      code:
        type: string
      created_at:
        type: string
      department_type:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      organization_id:
        type: string
      parent_id:
        type: string
      updated_at:
        type: string
    type: object
  taskmgmt_internal_model.Menu:
    properties:
      children:
        items:
          $ref: '#/definitions/taskmgmt_internal_model.Menu'
        type: array
      code:
        type: string
      created_at:
        type: string
      icon:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      is_hidden:
        type: boolean
      parent_id:
        type: string
      path:
        type: string
      required_permission:
        type: string
      sort_order:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  taskmgmt_internal_model.Notification:
    properties:
      body:
        type: string
      created_at:
        type: string
      id:
        type: string
      organization_id:
        type: string
      read_at:
        type: string
      recipient:
        $ref: '#/definitions/taskmgmt_internal_model.User'
      recipient_id:
        type: string
      task:
        $ref: '#/definitions/taskmgmt_internal_model.Task'
      task_id:
        type: string
      title:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  taskmgmt_internal_model.Permission:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      module:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  taskmgmt_internal_model.Role:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  taskmgmt_internal_model.Task:
    properties:
      approval_required:
        type: boolean
      assignments:
        items:
          $ref: '#/definitions/taskmgmt_internal_model.TaskAssignment'
        type: array
      children:
        items:
          $ref: '#/definitions/taskmgmt_internal_model.Task'
        type: array
      code:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      due_at:
        type: string
      id:
        type: string
      organization_id:
        type: string
      parent:
        $ref: '#/definitions/taskmgmt_internal_model.Task'
      parent_id:
        type: string
      priority:
        type: integer
      progress:
        type: integer
      reviews:
        items:
          $ref: '#/definitions/taskmgmt_internal_model.TaskReview'
        type: array
      root_task_id:
        type: string
      start_at:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      updates:
        items:
          $ref: '#/definitions/taskmgmt_internal_model.TaskUpdate'
        type: array
      version:
        type: integer
      weight:
        type: integer
    type: object
  taskmgmt_internal_model.TaskAssignment:
    properties:
      assigned_by:
        type: string
      assignee_department:
        $ref: '#/definitions/taskmgmt_internal_model.Department'
      assignee_department_id:
        type: string
      assignee_user:
        $ref: '#/definitions/taskmgmt_internal_model.User'
      assignee_user_id:
        type: string
      assignment_role:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_primary:
        type: boolean
      note:
        type: string
      organization_id:
        type: string
      responsible_user:
        $ref: '#/definitions/taskmgmt_internal_model.User'
      responsible_user_id:
        type: string
      task_id:
        type: string
      updated_at:
        type: string
    type: object
  taskmgmt_internal_model.TaskAttachment:
    properties:
      checksum:
        type: string
      content_type:
        type: string
      created_at:
        type: string
      file_name:
        type: string
      id:
        type: string
      size_bytes:
        type: integer
      status:
        description: pending -> active
        type: string
      task_id:
        type: string
      update_id:
        type: string
      updated_at:
        type: string
      uploaded_by:
        type: string
      uploader:
        $ref: '#/definitions/taskmgmt_internal_model.User'
    type: object
  taskmgmt_internal_model.TaskComment:
    properties:
      author:
        $ref: '#/definitions/taskmgmt_internal_model.User'
      author_id:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      task_id:
        type: string
      updated_at:
        type: string
    type: object
  taskmgmt_internal_model.TaskEvent:
    properties:
      actor:
        $ref: '#/definitions/taskmgmt_internal_model.User'
      actor_id:
        type: string
      created_at:
        type: string
      data:
        items:
          type: integer
        type: array
      event_type:
        type: string
      id:
        type: string
      organization_id:
        type: string
      task_id:
        type: string
    type: object
  taskmgmt_internal_model.TaskReview:
    properties:
      comment:
        type: string
      created_at:
        type: string
      decision:
        type: string
      id:
        type: string
      reviewed_at:
        type: string
      reviewer:
        $ref: '#/definitions/taskmgmt_internal_model.User'
      reviewer_id:
        type: string
      task_id:
        type: string
      update:
        $ref: '#/definitions/taskmgmt_internal_model.TaskUpdate'
      update_id:
        type: string
      updated_at:
        type: string
    type: object
  taskmgmt_internal_model.TaskUpdate:
    properties:
      attachments:
        items:
          $ref: '#/definitions/taskmgmt_internal_model.TaskAttachment'
        type: array
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      progress:
        type: integer
      submitted_at:
        type: string
      submitted_by:
        type: string
      submitter:
        $ref: '#/definitions/taskmgmt_internal_model.User'
      task_id:
        type: string
      updated_at:
        type: string
    type: object
  taskmgmt_internal_model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      organization_id:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  taskmgmt_internal_platform_response.ErrorDetails:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
      request_id:
        type: string
    type: object
  taskmgmt_internal_platform_response.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/taskmgmt_internal_platform_response.ErrorDetails'
    type: object
  taskmgmt_internal_platform_response.PaginationMeta:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  taskmgmt_internal_platform_response.SuccessResponse:
    properties:
      data: {}
      meta: {}
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: Đội ngũ phát triển
  description: Đặc tả API ứng dụng quản lý công việc nhiều cấp (Golang Fiber + PostgreSQL)
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Task Management Multi-Level API
  version: "1.1"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Xác thực tài khoản bằng username/password và nhận JWT Access Token
      parameters:
      - description: Thông tin tài khoản
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/taskmgmt_internal_platform_response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_auth.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/taskmgmt_internal_platform_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/taskmgmt_internal_platform_response.ErrorResponse'
      summary: Đăng nhập hệ thống
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Thu hồi Refresh Token hiện tại
      parameters:
      - description: Refresh Token
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_modules_auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/taskmgmt_internal_platform_response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_auth.LogoutResponse'
              type: object
      summary: Đăng xuất
      tags:
      - Auth
  /auth/me:
    get:
      description: Lấy thông tin cá nhân và vai trò của người dùng đang đăng nhập
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/taskmgmt_internal_platform_response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_auth.UserInfoResp'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/taskmgmt_internal_platform_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Thông tin tài khoản hiện tại
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Dùng Refresh Token hợp lệ để cấp mới Access Token
      parameters:
      - description: Refresh Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/taskmgmt_internal_platform_response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_auth.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/taskmgmt_internal_platform_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/taskmgmt_internal_platform_response.ErrorResponse'
      summary: Làm mới Access Token
      tags:
      - Auth
  /menus:
    get:
      description: Lấy toàn bộ cây menu không lọc quyền để phục vụ màn hình cấu hình
        Menu
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/taskmgmt_internal_platform_response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/taskmgmt_internal_model.Menu'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Danh sách toàn bộ Menu hệ thống (Dành cho Quản trị viên)
      tags:
      - Menus
    post:
      consumes:
      - application/json
      description: Quản trị viên thêm menu mới vào cây điều hướng
      parameters:
      - description: Thông tin menu mới
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_menus.CreateMenuRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/taskmgmt_internal_platform_response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/taskmgmt_internal_model.Menu'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/taskmgmt_internal_platform_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Thêm mới mục Menu
      tags:
      - Menus
  /menus/{menuId}:
    delete:
      description: Xóa menu khỏi cây điều hướng (chỉ xóa được menu lá không có menu
        con)
      parameters:
      - description: ID Menu (UUID)
        in: path
        name: menuId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/taskmgmt_internal_platform_response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/taskmgmt_internal_platform_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/taskmgmt_internal_platform_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Xóa mục Menu
      tags:
      - Menus
    patch:
      consumes:
      - application/json
      description: Sửa tên, icon, đường dẫn, quyền yêu cầu hoặc vị trí của menu
      parameters:
      - description: ID Menu (UUID)
        in: path
        name: menuId
        required: true
        type: string
      - description: Thông tin cập nhật
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_menus.UpdateMenuRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/taskmgmt_internal_platform_response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/taskmgmt_internal_model.Menu'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/taskmgmt_internal_platform_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/taskmgmt_internal_platform_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cập nhật mục Menu
      tags:
      - Menus
  /menus/user-menus:
    get:
      description: Lấy danh sách menu dạng cây phân cấp đã được lọc theo quyền của
        user, định dạng chuẩn :items của Ant Design a-menu
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/taskmgmt_internal_platform_response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_modules_menus.AntdMenuItem'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Lấy cây Menu động cho người dùng hiện tại (Chuẩn Ant Design)
      tags:
      - Menus
  /notifications:
    get:
      description: Lấy danh sách thông báo của người dùng hiện tại có phân trang và
        lọc chưa đọc
      parameters:
      - description: Trang (mặc định 1)
        in: query
        name: page
        type: integer
      - description: Số lượng (mặc định 20)
        in: query
        name: page_size
        type: integer
